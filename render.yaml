# Render blueprint for the QuickPlate API (free web service).
# New > Blueprint > pick this repo, then paste the service account key into
# FIREBASE_SERVICE_ACCOUNT_JSON when Render asks for it.
services:
  - type: web
    name: quickplate-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO_ENDPOINTS
        value: "true"
      - key: SIM_STEP_SECONDS
        value: "20"
      - key: CORS_ORIGIN
        value: "*"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
