name: quickplate
description: "QuickPlate: browse restaurants, order food and track delivery live."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State and navigation
  provider: ^6.1.5+1
  go_router: ^18.0.2

  # Networking and config
  dio: ^5.11.1
  flutter_dotenv: ^6.0.1

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0

  # Maps and location
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1

  # UI
  cached_network_image: ^4.0.4
  shimmer: ^4.0.0
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
