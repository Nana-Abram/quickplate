name: Keep API warm

# Render's free tier sleeps after 15 idle minutes and takes up to a minute to
# wake. A health check every 10 minutes keeps the demo API responsive for
# anyone trying the app. One always-on free service fits in Render's monthly
# free hours.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 90 https://quickplate-api.onrender.com/v1/health
